<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6A1B9A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <title>Nueva Contraseña - Argos2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="reset-container glass-container">
        <div class="reset-header">
            <img src="assets/icons/candado.svg" class="icon-large" alt="Icono candado">
            <h1>Nueva Contraseña</h1>
        </div>
        
        <p class="info-text">Ingresa el código enviado a tu correo y define tu nueva contraseña.</p>
        
        <form id="reset-form">
            <div class="code-input-group">
                <input type="text" maxlength="1" class="code-digit" data-index="0" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-digit" data-index="1" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-digit" data-index="2" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-digit" data-index="3" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-digit" data-index="4" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-digit" data-index="5" inputmode="numeric" pattern="[0-9]" required>
            </div>
            
            <div class="input-group">
                <label for="new-password">NUEVA CLAVE</label>
                <div class="input-wrapper">
                    <img src="assets/icons/llave.svg" class="input-icon" alt="Icono llave">
                    <input type="password" id="new-password" name="new-password" placeholder="Mínimo 8 caracteres" required>
                </div>
            </div>
            
            <div class="input-group">
                <label for="confirm-password">CONFIRMAR CLAVE</label>
                <div class="input-wrapper">
                    <img src="assets/icons/llave.svg" class="input-icon" alt="Icono llave">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita su clave" required>
                </div>
            </div>
            
            <button type="submit" id="btn-cambiar">CAMBIAR CONTRASEÑA</button>
        </form>
        
        <div class="resend-section">
            <span id="countdown">Reenviar código en 2:00</span>
            <a href="#" id="resend-link" style="display:none">Reenviar código</a>
        </div>
        
        <div class="link-volver">
            <a href="index.html">Volver al login</a>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <script src="js/toast.js?v=20260505b"></script>
    <script src="js/auth2.js"></script>
    <script src="js/reset-password.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[SW] Registrado:', reg.scope))
                    .catch(err => console.warn('[SW] Error al registrar:', err));
            });
        }
    </script>
</body>
</html>

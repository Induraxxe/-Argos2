<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6A1B9A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <title>Recuperar Contraseña - Argos2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="recuperar-container glass-container">
        <div class="recuperar-header">
            <img src="assets/icons/candado.svg" class="icon-large" alt="Icono candado">
            <h1>Recuperar Contraseña</h1>
        </div>
        
        <p class="info-text">Ingresa tu correo electrónico y te enviaremos un código para restablecer tu contraseña.</p>
        
        <form id="recuperar-form">
            <div class="input-group">
                <label for="email">CORREO</label>
                <div class="input-wrapper">
                    <img src="assets/icons/sobre.svg" class="input-icon" alt="Icono correo">
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                </div>
            </div>
            
            <button type="submit" id="btn-enviar">ENVIAR CÓDIGO</button>
        </form>
        
        <div class="link-volver">
            <a href="index.html">Volver al login</a>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <script src="js/toast.js?v=20260505b"></script>
    <script src="js/auth2.js"></script>
    <script src="js/recuperar.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[SW] Registrado:', reg.scope))
                    .catch(err => console.warn('[SW] Error al registrar:', err));
            });
        }
    </script>
</body>
</html>
